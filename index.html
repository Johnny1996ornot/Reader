<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Reader App</title>
  <!-- PDF parsing library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; color: #333; line-height: 1.5; }
    h2 { text-align: center; }
    .card { background: #f9f9f9; padding: 1.5rem; border-radius: 12px; border: 1px solid #e0e0e0; margin-bottom: 1rem; }
    input[type="text"], input[type="file"], textarea, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background: #0066cc; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:disabled { background: #999; }
    .controls { display: flex; gap: 10px; }
    textarea { height: 120px; resize: vertical; }
  </style>
</head>
<body>

  <h2>Web & PDF Audio Reader</h2>

  <div class="card">
    <label><strong>Option 1: Paste Web Article Link</strong></label>
    <input type="text" id="urlInput" placeholder="https://example.com/article">
    <button onclick="fetchWebText()">Extract Website Text</button>
  </div>

  <div class="card">
    <label><strong>Option 2: Upload PDF File</strong></label>
    <input type="file" id="pdfInput" accept="application/pdf" onchange="parsePDF(event)">
  </div>

  <div class="card">
    <label><strong>Text Output</strong></label>
    <textarea id="textContent" placeholder="Extracted text will appear here..."></textarea>
    
    <div class="controls">
      <button id="playBtn" onclick="togglePlay()">Play Audio</button>
      <button style="background: #cc3333;" onclick="stopAudio()">Stop</button>
    </div>
  </div>

  <!-- Audio element to trigger native OS background media playback -->
  <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 1. Fetch text from web link
    async function fetchWebText() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return alert('Please enter a valid URL.');
      
      try {
        document.getElementById('textContent').value = "Fetching article text...";
        const response = await fetch(`https://r.jina.ai/${url}`);
        const text = await response.text();
        document.getElementById('textContent').value = text;
      } catch (err) {
        alert('Could not retrieve webpage content. Check the link and try again.');
      }
    }

    // 2. Extract text from uploaded PDF
    async function parsePDF(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('textContent').value = "Extracting text from PDF...";
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        fullText += pageText + '\n\n';
      }
      document.getElementById('textContent').value = fullText;
    }

    // 3. TTS and Background Audio Logic
    const synth = window.speechSynthesis;
    let utterance = null;
    let isPlaying = false;

    function togglePlay() {
      if (isPlaying) {
        synth.pause();
        document.getElementById('playBtn').innerText = "Resume Audio";
        isPlaying = false;
        return;
      }

      const text = document.getElementById('textContent').value.trim();
      if (!text) return alert('No text available to read.');

      // Start silent background audio stream to keep mobile CPU active when screen turns off
      const silentAudio = document.getElementById('silentAudio');
      silentAudio.play().catch(() => {});

      if (synth.paused) {
        synth.resume();
      } else {
        synth.cancel();
        utterance = new SpeechSynthesisUtterance(text);
        
        // Auto-select best natural/neural voice available on device
        const voices = synth.getVoices();
        const bestVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Enhanced')));
        if (bestVoice) utterance.voice = bestVoice;

        utterance.onend = () => stopAudio();
        synth.speak(utterance);
      }

      // Configure lock-screen controls for mobile OS
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Web/PDF Voice Reader",
          artist: "Background AI Reader"
        });
        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
      }

      document.getElementById('playBtn').innerText = "Pause Audio";
      isPlaying = true;
    }

    function stopAudio() {
      synth.cancel();
      document.getElementById('silentAudio').pause();
      document.getElementById('playBtn').innerText = "Play Audio";
      isPlaying = false;
    }

    // Ensure voices load reliably on mobile Safari/Chrome
    window.speechSynthesis.onvoiceschanged = () => synth.getVoices();
  </script>
</body>
</html>
