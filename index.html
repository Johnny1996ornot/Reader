<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natural Male Voice Reader</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; max-width: 650px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 2rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    .btn { display: inline-block; background: #2563eb; color: #fff; font-weight: bold; padding: 12px 24px; border-radius: 30px; text-decoration: none; margin: 1rem 0; cursor: grab; }
    textarea { width: 100%; height: 120px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
  </style>
</head>
<body>

  <h2>Natural Male Voice Reader</h2>

  <div class="card">
    <p><strong>Option A (Desktop):</strong> Drag the button below to your Bookmarks Bar (`Ctrl+Shift+B`):</p>
    <div style="text-align: center;">
      <a class="btn" href="javascript:(function(){if(document.getElementById('ai-reader-widget')){return;}var el=Array.from(document.querySelectorAll('p,h1,h2,h3,article')).filter(e=>e.innerText.trim().length>25);if(!el.length){alert('No readable text found on this page.');return;}var i=0,p=false,synth=window.speechSynthesis;synth.cancel();var d=document.createElement('div');d.id='ai-reader-widget';d.style.cssText='position:fixed;bottom:24px;right:24px;z-index:999999;background:#0f172a;color:#fff;padding:12px 18px;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.4);font-family:sans-serif;display:flex;align-items:center;gap:12px;width:320px;box-sizing:border-box;border:1px solid #334155;';d.innerHTML='<div style=&quot;flex:1;overflow:hidden;&quot;><div id=&quot;air-status&quot; style=&quot;font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;&quot;>Male AI Voice Ready</div></div><button id=&quot;air-play&quot; style=&quot;background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:13px;&quot;>Play</button><button id=&quot;air-close&quot; style=&quot;background:#ef4444;color:#fff;border:none;padding:8px 10px;border-radius:50%;cursor:pointer;font-size:12px;&quot;>✕</button>';document.body.appendChild(d);var st=document.getElementById('air-status'),pl=document.getElementById('air-play'),cl=document.getElementById('air-close');function sn(){if(i>=el.length||!p){stop();st.innerText='Finished reading.';return;}el.forEach(e=>e.style.backgroundColor='');var c=el[i];c.style.backgroundColor='#2563eb33';c.scrollIntoView({behavior:'smooth',block:'center'});st.innerText='Reading paragraph '+(i+1)+'/'+el.length;synth.cancel();var u=new SpeechSynthesisUtterance(c.innerText);u.rate=0.95;u.pitch=0.9;var v=synth.getVoices();var male=v.find(x=>x.lang.startsWith('en')&&(x.name.includes('Male')||x.name.includes('David')||x.name.includes('George')||x.name.includes('Natural')||x.name.includes('Google US English')));if(male)u.voice=male;u.onend=function(){if(p){i++;sn();}};u.onerror=function(){if(p){i++;sn();}};synth.speak(u);}function stop(){synth.cancel();p=false;pl.innerText='Play';el.forEach(e=>e.style.backgroundColor='');}pl.onclick=function(){if(p){synth.pause();p=false;pl.innerText='Resume';}else if(synth.paused){synth.resume();p=true;pl.innerText='Pause';}else{p=true;pl.innerText='Pause';sn();}};cl.onclick=function(){stop();d.remove();};window.speechSynthesis.onvoiceschanged=function(){synth.getVoices();};})();">🎙️ Read with Male Voice</a>
    </div>

    <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #e2e8f0;">

    <p><strong>Option B (Mobile & Laptop Manual Setup):</strong> Copy the code below and paste it into the URL field of a saved bookmark:</p>
    <textarea readonly onclick="this.select()">javascript:(function(){if(document.getElementById('ai-reader-widget')){return;}var el=Array.from(document.querySelectorAll('p,h1,h2,h3,article')).filter(e=>e.innerText.trim().length>25);if(!el.length){alert('No readable text found on this page.');return;}var i=0,p=false,synth=window.speechSynthesis;synth.cancel();var d=document.createElement('div');d.id='ai-reader-widget';d.style.cssText='position:fixed;bottom:24px;right:24px;z-index:999999;background:#0f172a;color:#fff;padding:12px 18px;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.4);font-family:sans-serif;display:flex;align-items:center;gap:12px;width:320px;box-sizing:border-box;border:1px solid #334155;';d.innerHTML='<div style="flex:1;overflow:hidden;"><div id="air-status" style="font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Male AI Voice Ready</div></div><button id="air-play" style="background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:13px;">Play</button><button id="air-close" style="background:#ef4444;color:#fff;border:none;padding:8px 10px;border-radius:50%;cursor:pointer;font-size:12px;">✕</button>';document.body.appendChild(d);var st=document.getElementById('air-status'),pl=document.getElementById('air-play'),cl=document.getElementById('air-close');function sn(){if(i>=el.length||!p){stop();st.innerText='Finished reading.';return;}el.forEach(e=>e.style.backgroundColor='');var c=el[i];c.style.backgroundColor='#2563eb33';c.scrollIntoView({behavior:'smooth',block:'center'});st.innerText='Reading paragraph '+(i+1)+'/'+el.length;synth.cancel();var u=new SpeechSynthesisUtterance(c.innerText);u.rate=0.95;u.pitch=0.9;var v=synth.getVoices();var male=v.find(x=>x.lang.startsWith('en')&&(x.name.includes('Male')||x.name.includes('David')||x.name.includes('George')||x.name.includes('Natural')||x.name.includes('Google US English')));if(male)u.voice=male;u.onend=function(){if(p){i++;sn();}};u.onerror=function(){if(p){i++;sn();}};synth.speak(u);}function stop(){synth.cancel();p=false;pl.innerText='Play';el.forEach(e=>e.style.backgroundColor='');}pl.onclick=function(){if(p){synth.pause();p=false;pl.innerText='Resume';}else if(synth.paused){synth.resume();p=true;pl.innerText='Pause';}else{p=true;pl.innerText='Pause';sn();}};cl.onclick=function(){stop();d.remove();};window.speechSynthesis.onvoiceschanged=function(){synth.getVoices();};})();</textarea>
  </div>

</body>
</html>
